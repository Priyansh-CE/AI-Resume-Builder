<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header>
  <h1>AI Resume Builder</h1>
  <p>Build ATS-friendly resumes</p>
</header>

<main class="container">

<section class="form-section">
  <h2>Resume Details</h2>

  <input id="name" placeholder="Full Name">
  <input id="role" placeholder="Job Role">

  <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
  <textarea id="projects" placeholder="Projects / Experience"></textarea>

  <button onclick="generateResume()">Preview</button>
  <button onclick="improveWithAI()">AI Improve Content 🤖</button>
  <button onclick="downloadPDF()">Download PDF 📄</button>

  <hr>

  <h3>Job Description (ATS)</h3>
  <textarea id="jd" placeholder="Paste job description here"></textarea>
  <button onclick="calculateATS()">Check ATS Score 📊</button>
</section>

<section class="resume-section" id="resume">
  <h2 id="r-name">Your Name</h2>
  <p id="r-role"></p>

  <h3>Skills</h3>
  <p id="r-skills"></p>

  <h3>Projects</h3>
  <ul id="r-projects"></ul>

  <div class="ats-box">
    <h3>ATS Score</h3>
    <div id="atsScore">--%</div>
    <p id="missing"></p>
  </div>
</section>

</main>

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="js/app.js"></script>
</body>
</html>
