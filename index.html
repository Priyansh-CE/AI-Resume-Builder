<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header>
  <h1>AI Resume Builder</h1>
  <p>Create a professional resume with AI</p>

  <div class="top-controls">
    <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<!-- AUTH -->
<div class="auth-box" id="authBox">
  <h2>Login / Signup</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Signup</button>
</div>

<main class="container fade-in" id="app" style="display:none">
  
  <section class="form-section">
    <h2>Your Details</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="role" placeholder="Job Role">
    <textarea id="skills" placeholder="Skills"></textarea>
    <textarea id="projects" placeholder="Projects"></textarea>

    <button onclick="generateResume()">Preview</button>
    <button onclick="generateAI()">AI Improve 🤖</button>
    <button onclick="saveResume()">Save 💾</button>
    <button onclick="loadResume()">Load 📂</button>
    <button onclick="downloadPDF()">PDF 📄</button>
  </section>

  <section class="resume-section classic" id="resume">
    <h2 id="r-name">Your Name</h2>
    <p id="r-role"></p>

    <h3>Skills</h3>
    <p id="r-skills"></p>

    <h3>Projects</h3>
    <p id="r-projects"></p>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="js/ai.js"></script>
<script src="js/pdf.js"></script>

</body>
</html>
