<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Resume Builder</h1>
  <p>Templates • Local Save • PDF</p>
</header>

<main class="container" id="app">

<section class="form-section">
  <h2>Resume Details</h2>

  <input id="name" placeholder="Full Name">
  <input id="role" placeholder="Job Role">
  <textarea id="skills" placeholder="Skills"></textarea>
  <textarea id="projects" placeholder="Projects / Experience (one per line)"></textarea>

  <select onchange="changeTemplate(this.value)">
    <option value="classic">Classic</option>
    <option value="modern">Modern</option>
  </select>

  <button onclick="generateResume()">Preview</button>
  <button onclick="saveResume()">Save Resume 💾</button>
  <button onclick="downloadPDF()">Download PDF 📄</button>

  <hr>
  <h3>Saved Resumes</h3>
  <select id="versions" onchange="loadVersion(this.value)">
    <option value="">Select saved resume</option>
  </select>
</section>

<section class="resume-section classic" id="resume">
  <h2 id="r-name">Your Name</h2>
  <p id="r-role"></p>

  <h3>Skills</h3>
  <p id="r-skills"></p>

  <h3>Projects</h3>
  <ul id="r-projects"></ul>
</section>

</main>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- APP JS -->
<script src="js/app.js"></script>

</body>
</html>
