<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>AI Resume Builder</h1>
  <p>AI • Templates • Firebase • PDF</p>
</header>

<!-- AUTH -->
<div class="auth-box" id="authBox">
  <h2>Login / Signup</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Signup</button>
</div>

<main class="container" id="app" style="display:none">

<section class="form-section">
  <h2>Resume Details</h2>

  <input id="name" placeholder="Full Name">
  <input id="role" placeholder="Job Role">
  <textarea id="skills" placeholder="Skills"></textarea>
  <textarea id="projects" placeholder="Projects / Experience"></textarea>

  <select onchange="changeTemplate(this.value)">
    <option value="classic">Classic</option>
    <option value="modern">Modern</option>
  </select>

  <button onclick="generateResume()">Preview</button>
  <button onclick="improveWithAI()">AI Improve 🤖</button>
  <button onclick="saveResume()">Save Version 💾</button>
  <button onclick="downloadPDF()">Download PDF 📄</button>
  <button onclick="logout()">Logout</button>

  <hr>
  <h3>Saved Versions</h3>
  <select id="versions" onchange="loadVersion(this.value)">
    <option value="">Select version</option>
  </select>
</section>

<section class="resume-section classic" id="resume">
  <h2 id="r-name">Your Name</h2>
  <p id="r-role"></p>

  <h3>Skills</h3>
  <p id="r-skills"></p>

  <h3>Projects</h3>
  <ul id="r-projects"></ul>
</section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>

</body>
</html>
