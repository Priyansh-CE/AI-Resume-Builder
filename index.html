<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <header>
    <h1>AI Resume Builder</h1>
    <p>Create a professional resume with AI assistance</p>
  </header>

  <main class="container">
    
    <!-- Form Section -->
    <section class="form-section">
      <h2>Enter Your Details</h2>

      <input type="text" id="name" placeholder="Full Name">
      <input type="text" id="role" placeholder="Job Role">
      <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
      <textarea id="projects" placeholder="Projects / Experience"></textarea>

      <button onclick="generateResume()">Generate Preview</button>
      <button onclick="generateAI()">AI Improve Content 🤖</button>
      <button onclick="downloadPDF()">Download PDF 📄</button>
    </section>

    <!-- Resume Preview -->
    <section class="resume-section" id="resume">
      <h2 id="r-name">Your Name</h2>
      <p id="r-role"><strong>Job Role</strong></p>

      <h3>Skills</h3>
      <p id="r-skills">Your skills will appear here</p>

      <h3>Projects</h3>
      <p id="r-projects">Your projects will appear here</p>
    </section>

  </main>

  <!-- External library for PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Your JS files -->
  <script src="js/app.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/pdf.js"></script>

</body>
</html>
